version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 397834978306.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=397834978306.dkr.ecr.us-east-1.amazonaws.com/coworking-analytics
      # Semantic Versioning: 1.0.<BUILD_NUMBER> (z.B. 1.0.1)
      - IMAGE_TAG="1.0.${CODEBUILD_BUILD_NUMBER:-0}"
  build:
    commands:
      - echo "Build started on `date`"
      - echo "Building Docker image with semantic tag $IMAGE_TAG..."
      - cd analytics
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Pushing Docker images to Amazon ECR..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Push complete for tag $IMAGE_TAG"
